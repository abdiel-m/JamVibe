@property --hero-a { syntax: "<color>"; inherits: true; initial-value: #FF8A4C66; }
:root {
  --bg: #12110F; --s1: #1C1A18; --s2: #262422; --s3: #33302C;           /* warm near-black + 3 surface steps */
  --fg: #F4F1EC; --muted: #A8A29A; --faint: #7A746D;
  --accent: #FF8A4C; --accent-ink: #12110F; --up: #5FD3B4; --down: #FF8A8A;
  --tint: #FF8A4C;                                                          /* current tab color (CONFIG.theme) */
  --display: Bricolage, "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-6: 24px; --sp-8: 32px; --sp-12: 48px;
  --r-s: 10px; --r-m: 16px; --r-l: 24px;
  --std: cubic-bezier(0.2, 0, 0, 1); --dec: cubic-bezier(0.05, 0.7, 0.1, 1); --acc: cubic-bezier(0.3, 0, 0.8, 0.15);
  --nav-h: 64px; --nav-gap: 12px; --dock-h: 48px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }   /* the standalone file has no host reset */
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 15px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.app { max-width: 430px; margin: 0 auto; min-height: 100%; position: relative; isolation: isolate;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(var(--nav-h) + var(--nav-gap) * 3 + var(--dock-h) + 16px + env(safe-area-inset-bottom, 0px)); }
.app::before { content: ""; position: absolute; inset: 0 0 auto; height: 400px; z-index: -1; pointer-events: none;
  background: linear-gradient(180deg, var(--hero-a), transparent 92%); }
@media (min-width: 560px) { body { background: #0B0A09; } .app { background: var(--bg); } }
h1, h2, h3 { margin: 0; font-family: var(--display); font-weight: 800; letter-spacing: -0.025em; line-height: 1.02; text-wrap: balance; }
h1 { font-size: clamp(34px, 10vw, 42px); overflow-wrap: anywhere; }
h2 { font-size: 20px; font-weight: 700; letter-spacing: -0.015em; line-height: 1.15; }
h3 { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.25; }
p { margin: 0; text-wrap: pretty; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.center { justify-self: center; }
.num { font-variant-numeric: tabular-nums lining-nums; }
.row { display: flex; align-items: center; gap: var(--sp-3); min-width: 0; }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }

/* Top bar: the brand hands over to the page title as you scroll */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 4; display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3);
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 12px max(16px, env(safe-area-inset-left, 0px));
  background: #12110FB8; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.top-left { position: relative; flex: 1; min-width: 0; height: 28px; }
.brand, .top-title { position: absolute; inset: 0 auto 0 0; display: flex; align-items: center; white-space: nowrap; max-width: 100%; }
.brand { font: 800 21px/1 var(--display); letter-spacing: -0.035em; }
.brand b { color: var(--accent); font-weight: 800; }
.top-title { font: 700 17px/1 var(--display); letter-spacing: -0.015em; opacity: 0; overflow: hidden; text-overflow: ellipsis; display: block; line-height: 28px; }
.switcher { display: inline-flex; align-items: center; gap: 6px; background: var(--s2); border: 0; border-radius: 999px; padding: 7px 10px 7px 14px; font-weight: 600; font-size: 14px; max-width: 60%; }
.switcher span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.back { background: none; border: 0; padding: 4px 0; color: var(--fg); font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }
@supports (animation-timeline: scroll()) {
  .top { background: transparent; backdrop-filter: none; -webkit-backdrop-filter: none;
    animation: top-bg linear both; animation-timeline: scroll(root block); animation-range: 30px 110px; }
  .top-title { animation: fade-in linear both; animation-timeline: scroll(root block); animation-range: 70px 130px; }
  .brand { animation: fade-out linear both; animation-timeline: scroll(root block); animation-range: 40px 100px; }
  @keyframes top-bg { from { background-color: #12110F00; } to { background-color: #12110FEB; } }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fade-out { to { opacity: 0; } }
}
.ico { width: 18px; height: 18px; flex: none; }

/* Page structure */
.page { display: grid; gap: var(--sp-8); padding-top: var(--sp-2); min-width: 0; }
.page-head { display: grid; gap: var(--sp-2); }
.lede { font-size: 17px; line-height: 1.4; max-width: 34ch; }
.tag { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.tag::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; }
.tag.real::before { background: var(--up); }
.block { display: grid; gap: var(--sp-3); min-width: 0; }
.block-h { display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp-3); }
.card, .surface { background: var(--s1); border-radius: var(--r-m); padding: var(--sp-4); display: grid; gap: var(--sp-3); min-width: 0; }

const icon = (name, cls = "ico") => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]}</svg>`;

// Seeded random numbers so the simulated months are the same on every load.
function mulberry32(a) { return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let x = Math.imul(a ^ (a >>> 15), 1 | a); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; }; }
function hash(s) { let h = 2166136261; for (const c of s) { h ^= c.codePointAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function gauss(rng) { let u = 0; while (u === 0) u = rng(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * rng()); }
function cumulative(ws) { const out = []; let s = 0; for (const w of ws) { s += w; out.push(s); } return out; }
function pick(cum, r) { const x = r * cum[cum.length - 1]; let lo = 0, hi = cum.length - 1; while (lo < hi) { const m = (lo + hi) >> 1; if (cum[m] > x) hi = m; else lo = m + 1; } return lo; }

/* ----- Storage: optional convenience only; the app works without it ----- */
const STORE_KEY = "jamvibe-demo-v1";
function loadSaved() { try { return JSON.parse(localStorage.getItem(STORE_KEY) || "null"); } catch { return null; } }
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify({ joined: state.joined, challenges: state.challenges, day: state.day, group: state.group, sponsorJoined: state.sponsorJoined, notes: state.notes, seenInvites: state.seenInvites })); } catch { /* storage blocked: keep in memory */ } }
function clearSaved() { try { localStorage.removeItem(STORE_KEY); } catch { /* ignore */ } }

/* =====================================================================================
   DATA MODEL: real all-time numbers + simulated months
   ===================================================================================== */
const MONTHS = CONFIG.sim.months.map((m) => ({ ...m, days: new Date(m.year, m.month, 0).getDate() }));
const THIS = CONFIG.sim.thisMonth, LAST = CONFIG.sim.lastMonth;
const ARTIST_INDEX = {};          // person -> Map(artist -> index in their top 50)
const ALL_TIME = {};              // person -> Map(artist -> real all-time plays)
for (const [pk, p] of Object.entries(DATA.people)) {
  ARTIST_INDEX[pk] = new Map(p.top50.map(([a], i) => [a, i]));
  ALL_TIME[pk] = new Map(p.top50);
}

function membersOf(gk) { return [...new Set([...(DATA.groups[gk] || []), ...(CONFIG.groups[gk].extraMembers || [])])].filter((pk) => DATA.people[pk]); }
function genreOf(artist) { return DATA.genres[artist] || null; }

/** Each person's typical monthly volume (seeded), then month-to-month wobble. */
function monthlyTotal(pk, mi) {
  const s = CONFIG.sim;
  const base = Math.exp(Math.log(s.medianMonthlyPlays) + s.spread * gauss(mulberry32(hash(`${s.seed}|${pk}|base`))));
  const wobble = Math.exp(s.monthToMonth * gauss(mulberry32(hash(`${s.seed}|${pk}|${mi}|wobble`))));
  return Math.max(s.minPlays, Math.min(s.maxPlays, Math.round(base * wobble)));
}

const SIM_CACHE = new Map();
/** Simulated month for one person: cum[day-1][i] = plays of artist i through that day; last index = other artists. */
function simMonth(pk, mi) {
  const key = pk + "|" + mi;
  if (SIM_CACHE.has(key)) return SIM_CACHE.get(key);
  const p = DATA.people[pk], m = MONTHS[mi], s = CONFIG.sim;
  const rng = mulberry32(hash(`${s.seed}|${pk}|${mi}|plays`));
  const named = p.top50.reduce((sum, [, n]) => sum + n, 0);
  const artistCum = cumulative([...p.top50.map(([, n]) => (n / named) * (1 - p.otherShare)), p.otherShare]);
  const dayCum = cumulative(Array.from({ length: m.days }, (_, d) => ([0, 6].includes(new Date(m.year, m.month - 1, d + 1).getDay()) ? s.weekendBoost : 1)));
  const width = p.top50.length + 1, daily = Array.from({ length: m.days }, () => new Uint32Array(width));
  const total = monthlyTotal(pk, mi);
  for (let i = 0; i < total; i++) daily[pick(dayCum, rng())][pick(artistCum, rng())]++;
  const cum = [], run = new Uint32Array(width);
  for (const d of daily) { for (let i = 0; i < width; i++) run[i] += d[i]; cum.push(run.slice()); }
  const out = { cum, total };
  SIM_CACHE.set(key, out);
  return out;
}

function dayFor(mi) { return mi === THIS ? state.day : MONTHS[mi].days; }
/** Plays of one artist. scope: {kind:"all"} for real all-time, or {kind:"month", mi, day?}. */
function playsOf(pk, artist, scope) {
  if (scope.kind === "all") return ALL_TIME[pk].get(artist) || 0;
  const i = ARTIST_INDEX[pk].get(artist);
  if (i == null) return 0;
  const day = scope.day ?? dayFor(scope.mi);
  return day < 1 ? 0 : simMonth(pk, scope.mi).cum[day - 1][i];
}
function totalOf(pk, scope) {
  if (scope.kind === "all") return DATA.people[pk].allTimePlays;
  const day = scope.day ?? dayFor(scope.mi);
  return day < 1 ? 0 : simMonth(pk, scope.mi).cum[day - 1].reduce((a, b) => a + b, 0);
}
/** Map artist -> plays for one person in a scope (named artists only). */
function artistPlays(pk, scope) {
  return new Map(DATA.people[pk].top50.map(([a]) => [a, playsOf(pk, a, scope)]).filter(([, n]) => n > 0));
}
function genreShares(pk, scope) {
  const g = new Map(); let sum = 0;
  for (const [a, n] of artistPlays(pk, scope)) { const gn = genreOf(a); if (gn) { g.set(gn, (g.get(gn) || 0) + n); sum += n; } }
  for (const [k, v] of g) g.set(k, v / (sum || 1));
  return g;
}
/** Every artist anyone in the group plays, most-played first. */
function groupArtists(gk, scope) {
  const tot = new Map();
  for (const pk of membersOf(gk)) for (const [a] of DATA.people[pk].top50) tot.set(a, (tot.get(a) || 0) + playsOf(pk, a, scope));
  return [...tot].sort((x, y) => y[1] - x[1] || x[0].localeCompare(y[0]));
}
/** Everyone in the group ranked by plays of one artist (people with 0 included, at the bottom). */
function leaderboard(gk, artist, scope) {
  return membersOf(gk).map((pk) => ({ pk, plays: playsOf(pk, artist, scope) })).sort((a, b) => b.plays - a.plays || byName(a.pk, b.pk));
}
function rankOf(board, pk) { return board.findIndex((r) => r.pk === pk) + 1; }
function cosine(a, b) {
  const A = ALL_TIME[a], B = ALL_TIME[b]; let dot = 0, na = 0, nb = 0;
  for (const [k, v] of A) { na += v * v; if (B.has(k)) dot += v * B.get(k); }
  for (const v of B.values()) nb += v * v;
  return na && nb ? dot / Math.sqrt(na * nb) : 0;
}
function sharedArtists(a, b) {
  return [...ALL_TIME[a]].filter(([k]) => ALL_TIME[b].has(k)).map(([k, v]) => [k, v, ALL_TIME[b].get(k)]).sort((x, y) => Math.min(y[1], y[2]) - Math.min(x[1], x[2]));
}
function pairs(gk) { const m = membersOf(gk), out = []; for (let i = 0; i < m.length; i++) for (let j = i + 1; j < m.length; j++) out.push([m[i], m[j], cosine(m[i], m[j])]); return out; }

/** Group Sound: average genre shares with each member weighted equally (real all-time). */
function groupSound(gk) {
  const members = membersOf(gk), avg = new Map(), per = members.map((pk) => [pk, genreShares(pk, { kind: "all" })]);
  for (const [, g] of per) for (const [k, v] of g) avg.set(k, (avg.get(k) || 0) + v / members.length);
  return [...avg].sort((a, b) => b[1] - a[1]).slice(0, 5).map(([genre, share]) => {
    const [leaner, lean] = per.map(([pk, g]) => [pk, g.get(genre) || 0]).sort((a, b) => b[1] - a[1] || byName(a[0], b[0]))[0];
    return { genre, share, leaner, lean };
  });
}

/** Rank-change alerts for the current month, from day 2 up to `upTo`. */
function alertsFor(gk, upTo) {
  const artists = groupArtists(gk, { kind: "all" }).slice(0, CONFIG.sim.alertArtists).map(([a]) => a);
  const out = [];
  for (let d = 2; d <= upTo; d++) {
    const today = [];
    for (const artist of artists) {
      const before = leaderboard(gk, artist, { kind: "month", mi: THIS, day: d - 1 });
      const now = leaderboard(gk, artist, { kind: "month", mi: THIS, day: d });
      now.forEach((row, idx) => {
        const r = idx + 1, was = rankOf(before, row.pk);
        if (r > 3 || was <= r || row.plays < CONFIG.sim.alertMinPlays) return;
        // The person directly passed: was above them yesterday, is below them today with strictly fewer plays.
        const passed = now.slice(idx + 1).find((o) => rankOf(before, o.pk) < was && o.plays < row.plays);
        if (passed) today.push({ day: d, artist, x: row.pk, y: passed.pk, rank: r });
      });
    }
    today.sort((a, b) => a.rank - b.rank || (b.x === CONFIG.viewer || b.y === CONFIG.viewer) - (a.x === CONFIG.viewer || a.y === CONFIG.viewer));
    out.push(...today.slice(0, 2));
  }
  return out;
}
function alertText(al) {
  return al.rank === 1 ? t("alertCrown", { x: who(al.x), y: who(al.y, false), artist: al.artist })
    : t("alertPassed", { x: who(al.x), y: who(al.y, false), artist: al.artist, rank: al.rank });
}
function closestRace(gk) {
  let best = null;
  for (const [artist] of groupArtists(gk, { kind: "all" }).slice(0, CONFIG.sim.alertArtists)) {
    const [a, b] = leaderboard(gk, artist, { kind: "month", mi: THIS });
    if (!a || !b || a.plays < 10 || b.plays === 0) continue;
    const gap = a.plays - b.plays;
    if (!best || gap < best.gap) best = { artist, leader: a.pk, chaser: b.pk, gap };
  }
  return best;
}

/* ----- Sponsored artists are made up, so their plays are simulated from how well each listener's taste fits their sound ----- */
const GENRE_SHARE_CACHE = new Map();
function allTimeGenres(pk) { if (!GENRE_SHARE_CACHE.has(pk)) GENRE_SHARE_CACHE.set(pk, genreShares(pk, { kind: "all" })); return GENRE_SHARE_CACHE.get(pk); }
/** 0..1: share of the listener's genre-tagged plays in the sponsor's genres, plus a bump for playing the artists they sound like. */
function sponsorFit(pk, sp) {
  const g = allTimeGenres(pk), share = sp.genres.reduce((s, x) => s + (g.get(x) || 0), 0);
  return Math.min(1, share + (sp.soundsLike.some((a) => ARTIST_INDEX[pk].has(a)) ? 0.15 : 0));
}
const SPONSOR_CACHE = new Map();
/** Plays of the sponsor's artist this month through `day` (seeded; nobody with a poor fit plays them). */
function sponsorPlays(pk, sp, day = state.day) {
  const key = pk + "|" + sp.id;
  if (!SPONSOR_CACHE.has(key)) {
    const fit = sponsorFit(pk, sp), rng = mulberry32(hash(`${CONFIG.sim.seed}|${key}|sponsor`)), cum = []; let run = 0;
    for (let d = 0; d < MONTHS[THIS].days; d++) { run += fit < 0.02 ? 0 : Math.round(fit * CONFIG.sponsorRate * (0.3 + 1.4 * rng())); cum.push(run); }
    SPONSOR_CACHE.set(key, cum);
  }
  return day < 1 ? 0 : SPONSOR_CACHE.get(key)[Math.min(day, MONTHS[THIS].days) - 1];
}
/** Sponsored challenges recommended to the viewer from their own listening, best fit first. (gk kept for callers; the pick is per person.) */
function sponsoredFor(gk) {
  const me = CONFIG.viewer;
  return CONFIG.sponsored.filter((sp) => sponsorFit(me, sp) >= CONFIG.sponsorMinFit)
    .sort((a, b) => sponsorFit(me, b) - sponsorFit(me, a));
}
/** The viewer's standing in a sponsored challenge, ranked against every listener in the demo, this month. */
function sponsorStanding(sp) {
  const scope = { kind: "month", mi: THIS };
  const pool = Object.keys(DATA.people).map((pk) => ({ pk, plays: sponsorPlays(pk, sp) })).sort((a, b) => b.plays - a.plays || byName(a.pk, b.pk));
  const n = pool.length, rank = rankOf(pool, CONFIG.viewer), me = pool[rank - 1];
  const tiers = sp.rewards.map((r) => {
    const cutoff = r.top || (r.pct ? Math.max(1, Math.ceil((n * r.pct) / 100)) : null);
    const label = r.top ? (r.top === 1 ? t("spTierTop1") : t("spTierTop", { n: r.top })) : r.pct ? t("spTierPct", { n: r.pct }) : t("spTierMin", { n: r.min });
    const qualifies = me.plays > 0 && (r.min ? me.plays >= r.min : rank <= cutoff);
    // Plays still needed: to reach the threshold, or to pass the person currently holding the last qualifying spot.
    const need = qualifies ? 0 : r.min ? r.min - me.plays : pool[cutoff - 1].plays - me.plays + 1;
    return { ...r, label, cutoff, qualifies, need };
  });
  return { n, rank, plays: me.plays, pct: Math.max(1, Math.ceil((rank / n) * 100)), leader: pool[0], tiers, pool };
}

/** Group Sound as a donut: slices draw in one after another; the center counts to the focused genre's share. */
function soundDonut(sound) {
  const colors = CONFIG.theme.sound, focus = sound.find((s) => s.genre === state.soundFocus) || sound[0];
  if (!focus) return "";
  let start = 0;

      ${100 - start > 0.5 ? `<li><div class="sound-row is-rest"><span class="sw" style="background:var(--s3)"></span><span class="grow muted">${tx("soundRest")}</span><span class="num muted">${Math.round(100 - start)}%</span></div></li>` : ""}</ul>`;
}

function renderMatch() {

/* ----- Group challenges: members invite each other; nobody is in a challenge until they accept -----
   A challenge: { id, from, invited: [pk], accepted: [pk], declined: [pk], artist, stakes, sentDay }.
   One invitee = head-to-head, two or more = group race. Most plays of the artist this month wins. */
const isViewer = (pk) => pk === CONFIG.viewer;
const chWaiting = (ch) => ch.invited.filter((pk) => !ch.accepted.includes(pk) && !ch.declined.includes(pk));
const chPlayers = (ch) => [ch.from, ...ch.accepted];
const chIsDuel = (ch) => ch.invited.length === 1;
/** pending: someone hasn't replied · active: replies are in and someone accepted · cancelled: everyone declined */
function chStatus(ch) { return chWaiting(ch).length ? "pending" : ch.accepted.length ? "active" : "cancelled"; }
const viewerPlays = (ch) => ch.from === CONFIG.viewer || ch.accepted.includes(CONFIG.viewer);
const viewerInvited = (ch) => chWaiting(ch).includes(CONFIG.viewer);
const validCh = (c) => c && typeof c.id === "string" && typeof c.from === "string" && Array.isArray(c.invited) && Array.isArray(c.accepted) && Array.isArray(c.declined);

/** Invites from friends arrive on their day (CONFIG.incoming), once, in groups the viewer has joined. Returns the new ones. */
function deliverInvites() {
  const fresh = [];
  for (const inc of CONFIG.incoming) {
    if (inc.arrive > state.day || state.seenInvites.includes(inc.id) || !state.joined.includes(inc.gk)) continue;
    state.seenInvites.push(inc.id);
    (state.challenges[inc.gk] ||= []).push({ id: inc.id, from: inc.from, invited: [...inc.others, CONFIG.viewer], accepted: [...inc.others], declined: [],
      artist: inc.artist, stakes: inc.stakes, sentDay: inc.arrive });
    fresh.push(inc);
  }
  return fresh;
}
function groupChallenges(gk) {
  const m = membersOf(gk);
  return (state.challenges[gk] || []).filter((c) => validCh(c) && m.includes(c.from));
}
/** Challenges that use one of the viewer's slots in a group: ones they play in, plus ones they sent that are still waiting. */
const slotsUsed = (gk) => groupChallenges(gk).filter((c) => viewerPlays(c) && chStatus(c) !== "cancelled").length;
/** Every challenge waiting on the viewer's reply, across their groups, newest first. */
function invitesForViewer() {
  return state.joined.flatMap((gk) => groupChallenges(gk).filter(viewerInvited).map((ch) => ({ gk, ch }))).sort((a, b) => b.ch.sentDay - a.ch.sentDay);
}
const unreadCount = () => invitesForViewer().length + state.notes.filter((n) => !n.read).length;
function findCh(id) {
  for (const gk of Object.keys(state.challenges)) { const ch = groupChallenges(gk).find((c) => c.id === id); if (ch) return { gk, ch }; }
  return null;
}

/** Friends answer the viewer's invites on the next simulated day (seeded, so the demo is repeatable). */
function simulateReplies() {
  const out = [];
  for (const gk of Object.keys(state.challenges)) for (const ch of groupChallenges(gk)) {
    if (ch.from !== CONFIG.viewer || ch.sentDay >= state.day) continue;
    for (const pk of chWaiting(ch)) {
      const yes = mulberry32(hash(`${ch.id}|${pk}|reply`))() < CONFIG.replyAcceptRate;
      (yes ? ch.accepted : ch.declined).push(pk);
      const note = { id: `${ch.id}|${pk}`, gk, pk, artist: ch.artist, yes, day: state.day, read: false };
      state.notes.unshift(note); out.push(note);
    }
  }
  state.notes = state.notes.slice(0, 30);
  return out;
}

function chTitle(ch) {
  return chIsDuel(ch) ? t("duelTitle", { a: who(ch.from), b: who(ch.invited[0], false), artist: ch.artist }) : t("raceTitle2", { artist: ch.artist });
}
const chTypeLabel = (ch) => (chIsDuel(ch) ? t("typeDuel") : t("typeRace", { n: ch.invited.length + 1 }));
/** Standings among the people playing, this month. */
function chStandings(ch) {
  const scope = { kind: "month", mi: THIS };
  return chPlayers(ch).map((pk) => ({ pk, n: playsOf(pk, ch.artist, scope) })).sort((a, b) => b.n - a.n || byName(a.pk, b.pk));
}

}

/** Recap numbers for one month of one group. */
function recapData(gk, mi) {
  const scope = { kind: "month", mi }, members = membersOf(gk);
  const artists = groupArtists(gk, scope), [topArtist, topPlays] = artists[0] || ["", 0];
  const genres = new Map();
  for (const pk of members) for (const [a, n] of artistPlays(pk, scope)) { const g = genreOf(a); if (g) genres.set(g, (genres.get(g) || 0) + n); }
  const topGenre = [...genres].sort((a, b) => b[1] - a[1])[0]?.[0] || t("genreOther");
  const fan = leaderboard(gk, topArtist, scope)[0];
  const total = members.reduce((s, pk) => s + totalOf(pk, scope), 0);
  // Awards
  const stats = members.map((pk) => {
    const ap = artistPlays(pk, scope), tot = totalOf(pk, scope) || 1, gs = genreShares(pk, scope);
    const [favArtist, favPlays] = [...ap].sort((a, b) => b[1] - a[1])[0] || ["", 0];
    const others = members.filter((o) => o !== pk);
    const unique = [...ap].filter(([a]) => !others.some((o) => ALL_TIME[o].has(a))).reduce((s, [, n]) => s + n, 0);
    const otherPlays = tot - [...ap.values()].reduce((s, n) => s + n, 0);   // plays outside their top 50
    return { pk, favArtist, loyal: favPlays / tot, genres: [...gs.values()].filter((v) => v >= 0.02).length, deep: (unique + otherPlays) / tot, purist: gs.get(topGenre) || 0 };
  });
  const best = (k) => [...stats].sort((a, b) => b[k] - a[k] || byName(a.pk, b.pk))[0];
  const awards = CONFIG.awards.map((aw) => {
    const key = { loyal: "loyal", hopper: "genres", deepcuts: "deep", purist: "purist" }[aw.id], w = best(key);
    // Awards use first names ("Grace's"), never "You's".
    const vars = { name: nameOf(w.pk), artist: w.favArtist, count: w.genres, genre: topGenre, Genre: cap(topGenre),
      pct: pct({ loyal: w.loyal, hopper: 0, deepcuts: w.deep, purist: w.purist }[aw.id]) };
    const fill = (s) => s.replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? "");
    return { pk: w.pk, title: fill(aw.title), text: fill(aw.text) };
  });
  // Biggest rank changes vs. the month before, same day of the month for the current month.
  const prev = mi - 1, changes = [];
  if (prev >= 0) {
    const day = mi === THIS ? Math.min(state.day, MONTHS[prev].days) : MONTHS[prev].days;
    for (const [artist] of artists.slice(0, 10)) {
      const now = leaderboard(gk, artist, scope), before = leaderboard(gk, artist, { kind: "month", mi: prev, day });
      for (const r of now) {
        const from = rankOf(before, r.pk), to = rankOf(now, r.pk);
        if (from !== to && r.plays > 0) changes.push({ pk: r.pk, artist, from, to, d: Math.abs(from - to) });
      }
    }
    changes.sort((a, b) => b.d - a.d || a.to - b.to);
  }
  return { topArtist, topPlays, topGenre, fan, total, awards, changes: changes.slice(0, 4), prev };
}

const hexA = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };
/** Draw the 9:16 share card (1080x1920). Top ~14% and bottom ~25% stay clear for story overlays. */
function drawShareCard(canvas, gk) {
  const ctx = canvas.getContext("2d");
  if (!ctx) return;
  const P = CONFIG.share.palettes[state.sharePalette] || Object.values(CONFIG.share.palettes)[0];
  const W = 1080, H = 1920, X = 88, TOP = 290, FOOT = 1430;
  const D = (w, px) => `${w} ${px}px Bricolage, "Instrument Sans", system-ui, sans-serif`;
  const B = (w, px) => `${w} ${px}px "Instrument Sans", system-ui, sans-serif`;
  const put = (str, x, y, font, color, align = "left") => { ctx.font = font; ctx.fillStyle = color; ctx.textAlign = align; ctx.fillText(str, x, y); };
  const fit = (str, weight, size, min, maxLines) => { let lines; do { ctx.font = D(weight, size); lines = wrapLines(ctx, str, W - X * 2); size -= 6; } while (lines.length > maxLines && size > min); return { lines, size: size + 6 }; };
  ctx.fillStyle = P.bg; ctx.fillRect(0, 0, W, H);
  const glow = ctx.createRadialGradient(W * 0.92, H * 0.06, 10, W * 0.92, H * 0.06, W * 1.1);
  glow.addColorStop(0, hexA(P.accent, 0.3)); glow.addColorStop(1, hexA(P.accent, 0));
  ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
  ctx.textBaseline = "alphabetic";
  put(CONFIG.appName, X, TOP, D(800, 48), P.ink);
  put(MONTHS[THIS].label, W - X, TOP, B(500, 36), P.muted, "right");
  const group = CONFIG.groups[gk].name;
  let label = t("simLabel");

  if (state.shareTpl === "versus") {
    const a = CONFIG.viewer, b = shareFriend(gk);
    if (!b) return;
    const score = Math.round(cosine(a, b) * 100), tier = TEXT.matchTiers.find(([min]) => score >= min)[1], shared = sharedArtists(a, b);
    put(nameOf(a), X, 560, D(800, 150), P.ink);
    put(`${score}%`, X - 6, 900, D(800, 360), P.accent);
    put(nameOf(b), X, 1080, D(800, 150), P.ink);
    put(tier, X, 1190, B(600, 56), P.ink);
    put(shared.length ? t("shareVsShared", { n: shared.length }) : t("shareVsNone"), X, 1262, B(500, 44), P.muted);
    if (shared[0]) put(t("shareVsTop", { artist: shared[0][0] }), X, 1322, B(500, 44), P.muted);
    label = t("realLabel");
  } else if (state.shareTpl === "ranked") {
    const s = shareInfo(gk);
    if (!s) return;
    const head = fit(s.artist, 800, 112, 64, 2);
    let y = 470;
    for (const line of head.lines) { y += head.size; put(line, X, y, D(800, head.size), P.ink); }
    y += 64; put(t("shareRankedSub", { group }), X, y, B(500, 44), P.muted);
    const board = leaderboard(gk, s.artist, { kind: "month", mi: THIS }).slice(0, 6);
    y += 70;
    board.forEach((r, i) => {
      const first = i === 0, size = first ? 96 : 54, rowH = first ? 150 : 86, me = r.pk === CONFIG.viewer;
      y += rowH;
      put(String(i + 1), X, y, D(800, size), first ? P.accent : P.muted);
      put(nameOf(r.pk), X + (first ? 110 : 80), y, D(first ? 800 : 700, size), me || first ? P.ink : P.muted);
      put(fmt(r.plays), W - X, y, D(700, size), first ? P.accent : me ? P.ink : P.muted, "right");
      if (me && !first) { ctx.fillStyle = P.accent; ctx.fillRect(X - 36, y - size * 0.62, 10, size * 0.62); }
    });
  } else {
    const s = shareInfo(gk);
    if (!s) return;
    put(t("shareLead"), X, 600, D(700, 88), P.ink);
    put(`#${s.rank}`, X - 10, 920, D(800, 360), P.accent);
    const art = fit(s.artist, 800, 124, 64, 3);
    let y = 960;
    for (const line of art.lines) { y += art.size * 1.02; put(line, X, y, D(800, art.size), P.ink); }
    ctx.font = B(600, 60);
    for (const line of wrapLines(ctx, t("shareTail", { group }), W - X * 2)) { y += 80; put(line, X, y, B(600, 60), P.ink); }
    y += 70; put(t("sharePlays", { n: fmt(s.plays), month: MONTHS[THIS].short }), X, y, B(500, 44), P.muted);
  }
  // Group avatars + data label, kept above the bottom overlay zone
  let x = X;
  for (const pk of membersOf(gk).slice(0, 8)) {
    ctx.beginPath(); ctx.arc(x + 28, FOOT - 92, 28, 0, Math.PI * 2); ctx.fillStyle = colorOf(pk); ctx.fill();
    if (pk === CONFIG.viewer) { ctx.lineWidth = 5; ctx.strokeStyle = P.ink; ctx.stroke(); }
    x += 66;
  }
  put(label, X, FOOT, B(500, 30), P.muted);
}

function wrapLines(ctx, text, max) {
  const words = text.split(/\s+/), lines = []; let cur = "";
  for (const w of words) { const next = cur ? cur + " " + w : w; if (ctx.measureText(next).width > max && cur) { lines.push(cur); cur = w; } else cur = next; }

/** True when the page runs inside another page's frame (e.g. the claude.ai viewer), where plain downloads are blocked. */
function inFrame() { try { return window.self !== window.top; } catch { return true; } }

/** Save the card as PNG: the claude.ai viewer's save dialog when offered, a normal download when standalone. */
async function saveImage() {
  const canvas = $("#share-canvas");
  if (!canvas) return;
  const blob = await new Promise((res) => canvas.toBlob(res, "image/png"));
  if (!blob) { toast(t("saveFailed")); return; }
  const filename = `${CONFIG.appName.toLowerCase()}-${(state.shareArtist || "card").toLowerCase().replace(/[^a-z0-9]+/g, "-")}.png`;
  const viewer = window.claude && typeof window.claude.use === "function";
  const host = viewer ? await window.claude.use("downloads").catch(() => null) : null;
  if (host) {
    try { await host.save({ filename, data: blob }); toast(t("saved")); }
    catch (e) { toast(e && e.code === "declined" ? t("saveDeclined") : t("saveUnavailable")); }
    return;
  }
  // Inside a viewer without the save dialog (e.g. a signed-out visitor), a download link does nothing: say so.
  if (viewer || inFrame()) { toast(t("saveUnavailable")); return; }
  const url = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast(t("downloadStarted"));   // the page can't confirm the browser actually saved it
}

/* =====================================================================================

const MOTION = !(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

const raf = window.requestAnimationFrame ? (f) => window.requestAnimationFrame(f) : (f) => setTimeout(() => f(performance.now()), 16);
let lastScreenKey = null;
const SEG_MEMORY = new Map();

const parseCount = (text) => { const m = /^\s*([\d,]+)/.exec(text); return m ? Number(m[1].replace(/,/g, "")) : null; };
/** Before a same-screen re-render: where each reorderable row was, and what each counter showed. */
function snapshotMotion() {
  const pos = new Map(), counts = new Map();
  document.querySelectorAll("#screen [data-flip]").forEach((el) => pos.set(el.dataset.flip, el.getBoundingClientRect().top));
  document.querySelectorAll("#screen [data-count]").forEach((el) => counts.set(el.dataset.count, parseCount(el.textContent)));
  return { pos, counts };
}
/** After render: slide moved rows from their old spot (FLIP), tween numbers, glide segmented highlights. */
function playMotion(snap) {
  const screen = $("#screen");
  screen.classList.toggle("enter", MOTION && !snap);   // CSS entrance effects (e.g. donut slices) run only when a screen opens
  screen.querySelectorAll(".seg[data-seg]").forEach((el) => {
    const id = el.dataset.seg, to = Number(el.dataset.index), from = SEG_MEMORY.get(id);
    SEG_MEMORY.set(id, to);
    if (!MOTION || from == null || from === to) return;
    el.style.setProperty("--i", from); void el.offsetWidth; el.style.setProperty("--i", to);

  if (!MOTION) return;
  if (snap) screen.querySelectorAll("[data-flip]").forEach((el) => {
    const was = snap.pos.get(el.dataset.flip);
    if (was == null || !el.animate) return;
    const dy = was - el.getBoundingClientRect().top;
    if (Math.abs(dy) > 1) el.animate([{ transform: `translateY(${dy}px)` }, { transform: "none" }], { duration: 500, easing: "cubic-bezier(0.2, 0, 0, 1)" });
  });
  screen.querySelectorAll("[data-count]").forEach((el) => {
    const to = parseCount(el.textContent);
    const from = snap ? (snap.counts.has(el.dataset.count) ? snap.counts.get(el.dataset.count) : null) : el.dataset.countFrom === "0" ? 0 : null;
    if (to != null && from != null && from !== to) countUp(el, from, to);
  });
}
/** Tween a number (keeping any suffix like "%"); always lands exactly on the final value. */
function countUp(el, from, to, ms = 600) {
  const suffix = el.textContent.replace(/^\s*[\d,]+/, ""), start = performance.now();
  const step = (now) => {
    const k = Math.min(1, (now - start) / ms), eased = 1 - Math.pow(1 - k, 3);
    el.textContent = fmt(from + (to - from) * eased) + suffix;
    if (k < 1 && el.isConnected) raf(step);
  };
  el.textContent = fmt(from) + suffix;
  raf(step);
}
/** Run a screen change inside a View Transition when the browser has one; dir sets the slide direction. */
function navigate(update, dir = "none") {
  if (!(MOTION && document.startViewTransition)) { update(); return; }
  document.documentElement.dataset.dir = dir;
  document.startViewTransition(update);
}

/* =====================================================================================
   APP SHELL: top bar, tab bar, day controls, sheet, toast, rendering and events
   ===================================================================================== */
const TABS = [["home", "navHome", "home"], ["rank", "navRace", "race"], ["match", "navMatch", "match"], ["recap", "navRecap", "recap"]];
const RACE = ["rank", "challenges", "sponsored"];   // Race tab views, left to right
const tabOf = (tab) => (RACE.includes(tab) ? "rank" : tab);
const tabIndex = (tab) => TABS.findIndex(([k]) => k === tabOf(tab));
const SCREENS = { home: renderHome, rank: renderRank, challenges: renderChallenges, sponsored: renderSponsored, match: renderMatch, recap: renderRecap, share: renderShare, compare: renderCompare, join: renderJoin, inbox: renderInbox };
const TITLES = { home: () => CONFIG.groups[state.group].name, rank: () => state.rankArtist || t("raceBoards"), challenges: () => t("challengesTitle"), sponsored: () => t("spTitle"),
  match: () => t("matchTitle"), recap: () => t("navRecap"), share: () => t("shareTitle"), compare: () => t("compareTitle"), join: () => t("joinTitle"), inbox: () => t("inboxTitle") };

function inboxButton() {
  deliverInvites();   // the top bar draws before the screen, so deliver today's invites first
  const n = unreadCount();
  return `<button class="inbox-btn" data-action="open-inbox" aria-label="${n ? tx("inboxButtonCount", { n }) : tx("inboxButton")}" title="${tx("inboxButton")}">${icon("inbox", "")}${n ? `<span class="badge" aria-hidden="true">${n > 9 ? "9+" : n}</span>` : ""}</button>`;
}
function brandHtml() { const n = CONFIG.appName, i = Math.ceil(n.length / 2); return /^Jam/.test(n) ? `Jam<b>${esc(n.slice(3))}</b>` : `${esc(n.slice(0, i))}<b>${esc(n.slice(i))}</b>`; }
function buildNav() {
  $("#nav").innerHTML = `<span class="nav-ind" aria-hidden="true"></span>` +
    TABS.map(([k, label, ic]) => `<button data-action="tab" data-value="${k}">${icon(ic, "")}<span>${tx(label)}</span></button>`).join("");
  $("#fab-back").innerHTML = icon("rewind");
}
const odometer = (n) => String(n).split("").map((d) => `<span class="odo-col"><span class="odo-strip" style="--d:${d}">${[..."0123456789"].map((x) => `<span>${x}</span>`).join("")}</span></span>`).join("");
/** Day controls: the number rolls in place when the digit count stays the same. */
function updateDayDock() {
  const fab = $("#fab"), back = $("#fab-back"), m = MONTHS[THIS], done = state.day >= m.days, first = state.day <= 1, digits = String(state.day);
  $("#fab-dock").hidden = !!state.overlay;
  fab.hidden = !!state.overlay;
  fab.disabled = done; back.disabled = first;
  fab.dataset.day = state.day;
  const odo = fab.querySelector(".odo");
  if (!odo || odo.children.length !== digits.length) {
    fab.innerHTML = `${icon(done ? "check" : "forward")}<span>${tx("fabWord")}</span><span class="odo" aria-hidden="true">${odometer(state.day)}</span>`;
  } else {
    [...odo.children].forEach((col, i) => col.firstElementChild.style.setProperty("--d", digits[i]));
    fab.querySelector("svg").outerHTML = icon(done ? "check" : "forward");
  }
  fab.setAttribute("aria-label", done ? t("monthDone") : t("fabLabel", { day: state.day, days: m.days }));
  back.setAttribute("aria-label", first ? t("firstDay") : t("prevDay", { day: state.day, days: m.days }));
  fab.title = fab.getAttribute("aria-label"); back.title = back.getAttribute("aria-label");
}

function render() {
  const screen = state.overlay || state.tab;
  $("#top").innerHTML = state.overlay
    ? `<button class="back" data-action="close-overlay">${icon("back")}${tx("back")}</button><span class="brand-inline brand">${brandHtml()}</span>`
    : `<div class="top-left"><span class="brand">${brandHtml()}</span><span class="top-title" aria-hidden="true">${esc(TITLES[screen]())}</span></div>
       <div class="top-right">${screen === "home" ? inboxButton() : ""}<button class="switcher" data-action="open-switcher" aria-haspopup="dialog"><span>${esc(CONFIG.groups[state.group].name)}</span>${icon("chevron")}</button></div>`;
  const key = screen + "|" + state.group, entering = key !== lastScreenKey;
  lastScreenKey = key;
  const snap = entering ? null : snapshotMotion();
  $("#screen").innerHTML = SCREENS[screen]();
  playMotion(snap);
  // Screen gradient color (see CONFIG.theme) and the tab bar highlight
  const tint = CONFIG.theme.screens[screen] || CONFIG.theme.screens.home;
  document.querySelector(".app").style.setProperty("--hero-a", tint + CONFIG.theme.strength);
  const nav = $("#nav"), idx = tabIndex(state.tab);
  nav.style.setProperty("--x", idx);
  nav.style.setProperty("--tint", CONFIG.theme.screens[state.tab] || tint);
  nav.querySelector(".nav-ind").hidden = !!state.overlay;
  nav.querySelectorAll("button").forEach((b, i) => { if (i === idx && !state.overlay) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
  updateDayDock();
  if (screen === "share") paintShare();
  save();
}

function openSwitcher() {
  const el = $("#sheet");
  el.innerHTML = `<div class="sheet-backdrop" data-action="close-sheet"><div class="sheet" role="dialog" aria-modal="true" aria-label="${tx("yourGroups")}">
    <h2>${tx("yourGroups")}</h2>
    <ol class="list-plain">${state.joined.map((g) => `<li class="li"><button data-action="switch-group" data-value="${g}"><div class="avs">${membersOf(g).slice(0, 3).map((pk) => avatar(pk, "sm")).join("")}</div><span class="grow">${esc(CONFIG.groups[g].name)}</span>${g === state.group ? `<span class="pill new">${icon("check")}</span>` : ""}</button></li>`).join("")}</ol>
    <button class="btn" data-action="open-join">${tx("joinGroup")}</button>
  </div></div>`;
  el.hidden = false;
  el.querySelector("button")?.focus();
}
/** Sponsored challenge leaderboard, as a popup in the middle of the screen. Shows which prize each spot would win. */
function openSponsorBoard(id) {
  const sp = CONFIG.sponsored.find((x) => x.id === id);
  if (!sp) return;
  const st = sponsorStanding(sp);
  const prizeFor = (r, rank) => st.tiers.find((tr) => r.plays > 0 && (tr.min ? r.plays >= tr.min : rank <= tr.cutoff));
  const el = $("#sheet");
  el.innerHTML = `<div class="sheet-backdrop center" data-action="close-sheet"><div class="sheet sp-board" role="dialog" aria-modal="true" aria-labelledby="sp-board-title" tabindex="-1">
    <div class="row between"><span class="sponsor-by">${tx("spArtistBy", { artist: sp.artist })}</span><button class="link" data-action="sheet-close">${tx("close")}</button></div>
    <h2 id="sp-board-title">${esc(sp.title)}</h2>
    <p class="small muted">${tx("spBoardSub", { artist: sp.artist, n: st.n })} ${esc(daysLeftText())}.</p>
    <ol class="list-plain board-list">${st.pool.map((r, i) => { const tier = prizeFor(r, i + 1); return `
      <li class="li ${isViewer(r.pk) ? "me" : ""}"><span class="rank">${i + 1}</span>${avatar(r.pk, "sm")}
        <span class="grow name">${esc(who(r.pk))}</span>${tier ? `<span class="pill tier-pill">${esc(tier.label)}</span>` : ""}<span class="num small">${fmt(r.plays)}</span></li>`; }).join("")}</ol>
  </div></div>`;
  el.hidden = false;
  el.querySelector(".sheet").focus();
  el.querySelector(".li.me")?.scrollIntoView({ block: "nearest" });
}
function closeSheet() { $("#sheet").hidden = true; $("#sheet").innerHTML = ""; }

let toastTimer;
function toast(msg) { const el = $("#toast"); el.textContent = msg; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, msg.length > 60 ? 5000 : 2600); }
function go(tab) {
  const from = tabIndex(state.tab), to = tabIndex(tab), rf = RACE.indexOf(state.tab), rt = RACE.indexOf(tab);
  const dir = state.overlay ? "back" : to !== from ? (to > from ? "forward" : "back") : rf >= 0 && rt >= 0 && rf !== rt ? (rt > rf ? "forward" : "back") : "none";
  navigate(() => { state.tab = tab; state.overlay = null; render(); window.scrollTo(0, 0); }, dir);
}
function overlay(name) { closeSheet(); navigate(() => { state.overlay = name; render(); window.scrollTo(0, 0); }, "forward"); }

const ACTIONS = {
  "tab": (v) => go(v),
  "race-view": (v) => go({ board: "rank", challenges: "challenges", sponsored: "sponsored" }[v] || "rank"),
  "sound-focus": (v) => { state.soundFocus = v; render(); },
  "close-overlay": () => navigate(() => { state.overlay = null; render(); }, "back"),
  "open-switcher": openSwitcher,
  "close-sheet": (v, e) => { if (e.target.matches(".sheet-backdrop")) closeSheet(); },   // only taps outside the sheet
  "switch-group": (v) => { closeSheet(); navigate(() => { state.group = v; state.newAlertDay = null; state.rankArtist = null; state.soundFocus = null; render(); }); },
  "open-join": () => { state.joinMessage = null; state.joinCode = ""; overlay("join"); },
  "open-compare": () => overlay("compare"),
  "open-share": () => overlay("share"),
  "join": () => {
    const code = ($("#join-code")?.value || "").trim().toUpperCase();
    state.joinCode = code;
    const gk = Object.keys(CONFIG.groups).find((k) => CONFIG.groups[k].code.toUpperCase() === code);
    if (!code) state.joinMessage = t("joinEmpty");
    else if (!gk) state.joinMessage = t("joinBad", { code });
    else if (state.joined.includes(gk)) state.joinMessage = t("joinAlready", { group: CONFIG.groups[gk].name });
    else { state.joined.push(gk); state.group = gk; state.tab = "home"; state.rankArtist = null; state.newAlertDay = null; state.joinMessage = t("joinOk", { group: CONFIG.groups[gk].name }); toast(state.joinMessage); }
    render();
  },
  "simulate-day": () => {
    if (state.day >= MONTHS[THIS].days) return;
    state.day += 1;
    const fresh = alertsFor(state.group, state.day).filter((a) => a.day === state.day);
    state.newAlertDay = fresh.length ? state.day : -1;
    const replies = simulateReplies(), arrived = deliverInvites();
    render();
    if (arrived.length) toast(t("inviteArrived", { name: nameOf(arrived[arrived.length - 1].from) }));
    else if (replies.length) toast(replies.length === 1 ? replyText(replies[0]) : t("repliesToast", { n: replies.length }));
    else if (state.day === MONTHS[THIS].days) {
      const [artist] = groupArtists(state.group, { kind: "month", mi: THIS })[0] || [];
      const winner = artist && leaderboard(state.group, artist, { kind: "month", mi: THIS })[0];
      if (winner) toast(t("monthWinner", { name: who(winner.pk), artist }));
    } else if (fresh.length) toast(alertText(fresh[fresh.length - 1]));
  },
  "prev-day": () => {
    if (state.day <= 1) return;
    state.day -= 1;
    state.newAlertDay = null;   // stepping back shows the alerts as of that day, nothing "new"
    render();
  },
  "reset-day": () => { state.day = CONFIG.sim.startDay; state.newAlertDay = null; render(); },
  "reset-demo": () => { clearSaved(); Object.assign(state, { day: CONFIG.sim.startDay, joined: [...CONFIG.startJoined], group: CONFIG.startJoined[0], challenges: structuredClone(CONFIG.challenges), sponsorJoined: [], newAlertDay: null, challengeForm: null, notes: [], seenInvites: [], inboxFresh: [] }); deliverInvites(); go("home"); },
  "rank-scope": (v) => { state.rankScope = v; render(); },
  "recap-scope": (v) => { state.recapScope = v; render(); },
  "pick-artist": (v) => { state.rankArtist = v; render(); $("#board")?.scrollIntoView({ block: "nearest" }); },
  "new-challenge": () => { state.challengeForm = { picked: [], artist: null, stakes: null }; render(); $("#challenge-form")?.scrollIntoView({ block: "nearest" }); },
  "close-form": () => { state.challengeForm = null; render(); },
  "ch-pick": (v) => {
    const f = state.challengeForm; if (!f) return;
    f.picked = f.picked.includes(v) ? f.picked.filter((x) => x !== v) : [...f.picked, v];
    render(); document.querySelector(`[data-action="ch-pick"][data-value="${v}"]`)?.focus();
  },
  "ch-send": () => {
    const gk = state.group, f = state.challengeForm, members = membersOf(gk);
    if (!f || !f.picked.length || slotsUsed(gk) >= CONFIG.freeChallengeLimit) return;
    const invited = f.picked.filter((pk) => members.includes(pk) && !isViewer(pk));
    const stakes = (f.stakes ?? t("defaultStakes")).trim().slice(0, 80) || t("defaultStakes");
    (state.challenges[gk] ||= []).push({ id: "c" + Date.now().toString(36), from: CONFIG.viewer, invited, accepted: [], declined: [], artist: f.artist, stakes, sentDay: state.day });
    state.challengeForm = null; render(); toast(t("sentToast", { names: invited.map(nameOf).join(", ") }));
  },
  "ch-accept": (v) => {
    const hit = findCh(v); if (!hit || !viewerInvited(hit.ch)) return;
    if (slotsUsed(hit.gk) >= CONFIG.freeChallengeLimit) { toast(t("challengeLimit", { max: CONFIG.freeChallengeLimit })); return; }
    hit.ch.accepted.push(CONFIG.viewer); render(); toast(t("acceptedToast", { title: chTitle(hit.ch) }));
  },
  "ch-decline": (v) => {
    const hit = findCh(v); if (!hit || !viewerInvited(hit.ch)) return;
    hit.ch.declined.push(CONFIG.viewer); render(); toast(t("declinedToast", { name: nameOf(hit.ch.from) }));
  },
  // The sender ends (or cancels) their challenge; anyone else who accepted can leave it.
  "ch-end": (v) => {
    const hit = findCh(v); if (!hit || hit.ch.from !== CONFIG.viewer) return;
    const wasPending = chStatus(hit.ch) === "pending";
    state.challenges[hit.gk] = state.challenges[hit.gk].filter((c) => c.id !== v); render();
    toast(t(wasPending ? "challengeCancelled" : "challengeEnded"));
  },
  "ch-leave": (v) => {
    const hit = findCh(v); if (!hit || !hit.ch.accepted.includes(CONFIG.viewer)) return;
    hit.ch.accepted = hit.ch.accepted.filter((pk) => !isViewer(pk)); hit.ch.declined.push(CONFIG.viewer); render(); toast(t("challengeLeft"));
  },
  "open-inbox": () => { state.inboxFresh = state.notes.filter((n) => !n.read).map((n) => n.id); state.notes.forEach((n) => { n.read = true; }); overlay("inbox"); },
  "sponsor-board": (v) => openSponsorBoard(v),
  "sheet-close": () => closeSheet(),
  "sponsor-join": (v) => {
    const sp = CONFIG.sponsored.find((x) => x.id === v);
    if (!sp) return;
    const on = state.sponsorJoined.includes(v);
    state.sponsorJoined = on ? state.sponsorJoined.filter((x) => x !== v) : [...state.sponsorJoined, v];
    render();
    // Joining: follow the card up to its new place under "Joined".
    if (!on) requestAnimationFrame(() => document.querySelector(`#sponsored-joined [data-sponsor="${CSS.escape(v)}"]`)?.scrollIntoView({ behavior: MOTION ? "smooth" : "auto", block: "start" }));
    toast(t(on ? "spLeftToast" : "spJoinedToast", { title: sp.title }));
  },
  "share-tpl": (v) => navigate(() => { state.shareTpl = v; render(); }),
  "share-palette": (v) => navigate(() => { state.sharePalette = v; render(); }),
  "save-image": () => saveImage(),
};

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.action];
  if (fn) fn(el.dataset.value, e);
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !$("#sheet").hidden) closeSheet();
  if (e.key === "Enter" && e.target.id === "join-code") ACTIONS.join();
});
document.addEventListener("input", (e) => {
  if (e.target.id === "ch-stakes" && state.challengeForm) state.challengeForm.stakes = e.target.value;
  if (e.target.id === "artist-search") { state.rankSearch = e.target.value; $("#artist-list").innerHTML = artistListHtml(groupArtists(state.group, scopeOf(state.rankScope))); }
});
document.addEventListener("change", (e) => {
  const id = e.target.id, v = e.target.value;
  if (id === "match-a") { state.matchA = v; render(); }
  else if (id === "match-b") { state.matchB = v; render(); }
  else if (id === "compare-a") { state.compareA = v; render(); }
  else if (id === "compare-b") { state.compareB = v; render(); }
  else if (id === "share-artist") { state.shareArtist = v; render(); }
  else if (id === "share-friend") { state.shareFriend = v; render(); }
  else if (id === "ch-artist" && state.challengeForm) state.challengeForm.artist = v;
});

buildNav();
render();
</script>
