<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JamVibe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: phone-width column centered on desktop. Streaming-app patterns: big titles, group-tinted gradient wash
   at the top, side-scrolling shelves, a mini "race player" above a frosted tab bar. JamVibe orange stays the brand. */
:root {
  --bg: #0B0B10; --bg-2: #121219; --card: #18181F; --card-hi: #23232D; --line: #2B2B36;
  --fg: #FFFFFF; --muted: #A4A3B2; --accent: #FF8A4C; --accent-2: #FF5E8A; --accent-ink: #0B0B10; --good: #5FD3B4;
  --hero-a: #FF8A4C59;   /* set per group from CONFIG.groups[...].color */
  --font: ui-rounded, "SF Pro Rounded", "Nunito", "Varela Round", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 14px; --nav-h: 62px; --mini-h: 58px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { max-width: 430px; margin: 0 auto; min-height: 100%; position: relative; isolation: isolate;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px calc(var(--nav-h) + var(--mini-h) + 36px + env(safe-area-inset-bottom, 0px)); }
.app::before { content: ""; position: absolute; inset: 0 0 auto; height: 340px; z-index: -1; pointer-events: none;
  background: linear-gradient(180deg, var(--hero-a), transparent); }
@media (min-width: 560px) { body { background: #050507; } .app { background: var(--bg); border-inline: 1px solid var(--line); } }
h1, h2, h3 { margin: 0; font-weight: 900; letter-spacing: -0.02em; line-height: 1.1; text-wrap: balance; }
h1 { font-size: 32px; } h2 { font-size: 20px; font-weight: 800; } h3 { font-size: 15px; font-weight: 800; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.stack { display: grid; gap: 16px; min-width: 0; }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.between { justify-content: space-between; }
.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }

/* Top bar */
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 6px 12px; }
.brand { font-weight: 900; font-size: 20px; letter-spacing: -0.03em; }
.brand b { background: linear-gradient(135deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.switcher { display: inline-flex; align-items: center; gap: 6px; background: #FFFFFF1A; border: 0; border-radius: 999px; padding: 7px 12px; font-weight: 800; max-width: 62%; backdrop-filter: blur(12px); }
.switcher span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.back { background: none; border: 0; padding: 6px 0; color: var(--fg); font-weight: 800; display: inline-flex; gap: 4px; align-items: center; }

/* Surfaces */
.card { background: var(--card); border: 0; border-radius: var(--r); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.card.hot { box-shadow: 0 0 0 2px var(--accent) inset; }
.card.race { background: linear-gradient(135deg, #FF8A4C2E, #FF5E8A1F), var(--card); }
.eyebrow { font-size: 12px; font-weight: 800; letter-spacing: 0.02em; color: var(--muted); }
.section-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-top: 6px; }
.sim { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 800; color: var(--accent); background: #FF8A4C1F; border-radius: 999px; padding: 4px 10px; justify-self: start; white-space: nowrap; }
.real { color: var(--good); background: #5FD3B41F; }
.btn { border: 0; border-radius: 999px; padding: 13px 20px; font-weight: 900; background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; color: var(--fg); box-shadow: 0 0 0 1px #FFFFFF59 inset; }
.btn.small { padding: 8px 14px; font-size: 13px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.link { background: none; border: 0; padding: 0; color: var(--muted); font-weight: 800; text-decoration: underline; text-underline-offset: 3px; }
/* Filter chips (Rank / Recap scope) */
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg button { border: 0; background: var(--card-hi); border-radius: 999px; padding: 8px 14px; font-weight: 800; color: var(--fg); font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.field { display: grid; gap: 6px; font-size: 13px; font-weight: 800; color: var(--muted); }
.input, select.input { width: 100%; background: var(--card-hi); border: 0; border-radius: 10px; padding: 12px; color: var(--fg); font-weight: 700; }
.bar { height: 4px; background: #FFFFFF26; border-radius: 999px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--fg); border-radius: 999px; }
.card.race .bar i, .mini .prog i { background: linear-gradient(90deg, var(--accent), var(--accent-2)); }

/* People */
.av { --c: var(--accent); width: 34px; height: 34px; border-radius: 50%; background: var(--c); color: var(--accent-ink); display: inline-grid; place-items: center; font-weight: 900; font-size: 14px; flex: none; }
.av.sm { width: 26px; height: 26px; font-size: 11px; }
.av.lg { width: 52px; height: 52px; font-size: 20px; }
.avs { display: flex; }
.avs .av { box-shadow: 0 0 0 2px var(--bg); margin-left: -8px; }
.avs .av:first-child { margin-left: 0; }
.members { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.member { display: grid; justify-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--muted); width: 56px; flex: none; text-align: center; }

/* Cover art: generated gradient tiles (no artist images in the data) */
.art { display: inline-grid; place-items: center; flex: none; border-radius: 6px; background: var(--art); color: #FFFFFFE6; font-weight: 900; letter-spacing: -0.02em; text-shadow: 0 1px 8px #0005; box-shadow: 0 6px 18px #0007; overflow: hidden; }
.art.fluid { width: 100%; aspect-ratio: 1; font-size: 30px; border-radius: 8px; }

/* Quick shortcuts (2-column grid) */
.quick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.quick button { display: flex; align-items: center; gap: 10px; background: #FFFFFF14; border: 0; border-radius: 6px; overflow: hidden; padding: 0 10px 0 0; height: 56px; font-weight: 800; font-size: 13px; text-align: left; min-width: 0; }
.quick button span:last-child { overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.quick .art { border-radius: 0; box-shadow: none; }

/* Shelves (side-scrolling rows of tiles) */
.shelf { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(128px, 38%); gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 6px; scrollbar-width: none; min-width: 0; }
.shelf::-webkit-scrollbar, .members::-webkit-scrollbar { display: none; }
.tile { display: grid; gap: 6px; align-content: start; background: none; border: 0; padding: 0; text-align: left; scroll-snap-align: start; min-width: 0; }
.tile .name { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Lists */
.list { display: grid; gap: 2px; }
.li { display: flex; align-items: center; gap: 12px; padding: 8px 0; min-width: 0; }
.rank { width: 20px; font-weight: 800; color: var(--muted); text-align: center; flex: none; font-variant-numeric: tabular-nums; }
.name { font-weight: 800; overflow-wrap: anywhere; }
.crown { width: 18px; height: 18px; color: #F2C14E; flex: none; }
.pill { font-size: 12px; font-weight: 800; padding: 3px 10px; border-radius: 999px; background: #FFFFFF1A; color: var(--fg); white-space: nowrap; }
.pill.new { background: var(--accent); color: var(--accent-ink); }
.alert { display: flex; gap: 10px; align-items: flex-start; }
.alert p { font-weight: 700; }
.big { font-size: 34px; font-weight: 900; line-height: 1.05; letter-spacing: -0.03em; overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 0; background: var(--card-hi); border-radius: 999px; padding: 7px 12px; font-size: 13px; font-weight: 800; color: var(--fg); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.scroll-list { max-height: 300px; overflow-y: auto; display: grid; gap: 2px; padding-right: 2px; }
.artist-btn { display: flex; align-items: center; gap: 12px; text-align: left; border: 0; background: none; border-radius: 8px; padding: 6px; font-weight: 800; min-width: 0; }
.artist-btn:hover { background: #FFFFFF0F; }
.artist-btn[aria-pressed="true"] { background: #FFFFFF1A; }
.artist-btn .name { flex: 1; min-width: 0; }
.board-head { display: flex; gap: 16px; align-items: flex-end; }
.board-head h2 { font-size: 26px; font-weight: 900; overflow-wrap: anywhere; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.two > * { min-width: 0; }
.ring { --p: 50; width: 132px; height: 132px; border-radius: 50%; display: grid; place-items: center; margin: 4px auto;
  background: conic-gradient(var(--accent), var(--accent-2) calc(var(--p) * 1%), #FFFFFF1F 0); }
.ring div { width: 108px; height: 108px; border-radius: 50%; background: var(--card); display: grid; place-items: center; font-size: 30px; font-weight: 900; }
.award { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; }
.share-preview { width: 100%; max-width: 270px; aspect-ratio: 9 / 16; height: auto; border-radius: 16px; display: block; margin: 0 auto; background: var(--bg); box-shadow: 0 18px 48px #000A; }
.note { font-size: 13px; color: var(--fg); background: #FFFFFF14; border-radius: 10px; padding: 10px 12px; font-weight: 700; }
.empty { text-align: center; color: var(--muted); padding: 18px 8px; }

/* Mini race player + frosted tab bar */
.mini { position: fixed; z-index: 6; left: 50%; transform: translateX(-50%); width: min(calc(100% - 16px), 414px);
  bottom: calc(var(--nav-h) + 8px + env(safe-area-inset-bottom, 0px)); height: var(--mini-h);
  display: flex; align-items: center; gap: 10px; padding: 8px 10px 10px; border-radius: 10px;
  background: linear-gradient(90deg, var(--hero-a), #2A2733), #2A2733; box-shadow: 0 10px 30px #0009; }
.mini .art { border-radius: 4px; box-shadow: none; }
.mini-t { font-weight: 900; font-size: 14px; }
.mini-s { font-size: 12px; color: #FFFFFFB3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini .play { width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--fg); color: var(--bg); display: grid; place-items: center; flex: none; }
.mini .play:disabled { opacity: 0.5; cursor: not-allowed; }
.mini .play svg { width: 18px; height: 18px; }
.mini .prog { position: absolute; left: 10px; right: 10px; bottom: 4px; height: 2px; background: #FFFFFF33; border-radius: 2px; overflow: hidden; }
.mini .prog i { display: block; height: 100%; }
.nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: min(100%, 430px); z-index: 5;
  background: #0B0B10D9; display: grid; grid-template-columns: repeat(5, 1fr); backdrop-filter: blur(20px) saturate(1.4); -webkit-backdrop-filter: blur(20px) saturate(1.4);
  padding: 6px max(8px, env(safe-area-inset-left, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)); }
.nav button { border: 0; background: none; display: grid; justify-items: center; gap: 3px; padding: 6px 0; color: var(--muted); font-size: 10.5px; font-weight: 800; }
.nav button[aria-current="page"] { color: var(--fg); }
.nav button[aria-current="page"] svg { color: var(--accent); }
.nav svg { width: 24px; height: 24px; }
.ico { width: 18px; height: 18px; flex: none; }

/* Sheet and toast */
.sheet-backdrop { position: fixed; inset: 0; background: #000A; z-index: 10; display: grid; align-items: end; justify-items: center; }
.sheet { width: min(100%, 430px); background: var(--bg-2); border-radius: 16px 16px 0 0;
  padding: 18px max(16px, env(safe-area-inset-left, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 10px; }
.sheet .li { padding: 10px 0; }
.sheet .li button { all: unset; cursor: pointer; display: flex; gap: 12px; align-items: center; width: 100%; font-weight: 800; }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + var(--mini-h) + 22px + env(safe-area-inset-bottom, 0px)); z-index: 20;
  background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 800; font-size: 14px; max-width: calc(100% - 32px); text-align: center; }
@media (prefers-reduced-motion: no-preference) { .card.hot { animation: pop 0.5s ease-out; } @keyframes pop { from { transform: scale(0.98); } to { transform: none; } } .tile:active, .quick button:active { transform: scale(0.97); } }
</style>
</head>
<body>
<div class="app">
  <header class="top" id="top"></header>
  <main id="screen" tabindex="-1"></main>
</div>
<div class="mini" id="mini" role="region" aria-label="Monthly race"></div>
<nav class="nav" id="nav" aria-label="Main"></nav>
<div id="sheet" hidden></div>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script>
"use strict";
/* =====================================================================================
   EDIT HERE: CONFIG + TEXT. Names, colors, groups, join codes, challenges, awards and
   every message shown in the app live in this section. App logic is further down.
   ===================================================================================== */
const CONFIG = {
  appName: "JamVibe",
  viewer: "grace",                       // the person the demo is "logged in" as

  // Invented first names (never real user IDs) and one avatar color each, kept across every screen.
  people: {
    grace:  { name: "Grace",  color: "#FF8A4C" },
    eli:    { name: "Eli",    color: "#7FB2FF" },
    leila:  { name: "Leila",  color: "#F2C14E" },
    sofia:  { name: "Sofia",  color: "#C792EA" },
    chloe:  { name: "Chloe",  color: "#5FD3B4" },
    zoe:    { name: "Zoe",    color: "#FF6F91" },
    jordan: { name: "Jordan", color: "#B8E986" },
    nina:   { name: "Nina",   color: "#7FB2FF" },
    marcus: { name: "Marcus", color: "#F2C14E" },
    noah:   { name: "Noah",   color: "#C792EA" },
    priya:  { name: "Priya",  color: "#5FD3B4" },
    isaac:  { name: "Isaac",  color: "#FF6F91" },
    ethan:  { name: "Ethan",  color: "#7FB2FF" },
    diego:  { name: "Diego",  color: "#F2C14E" },
    owen:   { name: "Owen",   color: "#C792EA" },
    hannah: { name: "Hannah", color: "#5FD3B4" },
    lucy:   { name: "Lucy",   color: "#B8E986" },
  },

  // Groups. Members come from the data pipeline; extraMembers adds the viewer to groups she joined.
  groups: {
    pop:    { name: "Mostly Pop",     code: "POPCLUB", color: "#FF6F91", extraMembers: [] },
    hiphop: { name: "Mostly Hip Hop", code: "BARS",    color: "#F2C14E", extraMembers: ["grace"] },
    kpop:   { name: "Mostly K-Pop",   code: "ROOMIES", color: "#C792EA", extraMembers: ["grace"] },
  },
  startJoined: ["pop", "hiphop"],        // groups the viewer is already in; others are joined with their code

  // Simulated months. The dataset has no dates, so monthly plays are generated from each person's real play shares.
  sim: {
    seed: 2026,
    months: [
      { label: "September 2026", short: "Sep", year: 2026, month: 9 },
      { label: "October 2026",   short: "Oct", year: 2026, month: 10 },
      { label: "November 2026",  short: "Nov", year: 2026, month: 11 },
    ],
    thisMonth: 2, lastMonth: 1,          // indexes into months
    startDay: 18,                        // "Day 18 of 30" when the demo opens
    medianMonthlyPlays: 1000, spread: 0.35, minPlays: 400, maxPlays: 2200, monthToMonth: 0.15, weekendBoost: 1.25,
    alertArtists: 12,                    // rank-change alerts watch each group's top N artists
    alertMinPlays: 5,                    // ignore passes below this many plays (too early in the month to matter)
  },

  // Challenges each group starts with (max two active on the free plan). Targets are plays this month.
  challenges: {
    pop: [
      { type: "duel",  a: "grace", b: "sofia", artist: "Taylor Swift", stakes: "Loser builds the next group playlist" },
      { type: "goal",  artist: "Lady Gaga", target: 900, stakes: "Karaoke night if we hit it" },
    ],
    hiphop: [
      { type: "duel",      a: "isaac", b: "noah", artist: "Kanye West", stakes: "Loser buys the concert tickets" },
      { type: "recommend", a: "grace", b: "nina", artist: "Ariana Grande", target: 15, stakes: "Nina picks Grace's next album" },
    ],
    kpop: [],
  },
  freeChallengeLimit: 2,

  // Group awards in Recap. {name}, {pct}, {artist}, {genre}, {count} are filled in.
  awards: [
    { id: "loyal",    title: "Most loyal",     text: "{name} gave {pct} of their plays to {artist}." },
    { id: "hopper",   title: "Genre hopper",   text: "{name} played {count} different genres." },
    { id: "deepcuts", title: "Deep cuts",      text: "{pct} of {name}'s plays went to artists nobody else here plays." },
    { id: "purist",   title: "{Genre} purist", text: "{pct} of {name}'s plays were {genre}." },
  ],
};

const TEXT = {
  // Navigation
  navHome: "Home", navRank: "Rank", navMatch: "Match", navChallenges: "Challenges", navRecap: "Recap",
  back: "Back",
  // Labels
  simLabel: "Simulated month · example numbers",
  realLabel: "Real all-time numbers",
  plays: "{n} plays", playsOne: "1 play",
  you: "You", youLower: "you",
  thisMonth: "This month", lastMonth: "Last month", allTime: "All time",
  // Home
  homeMembers: "{n} members",
  raceDay: "Day {day} of {days}", resultsIn: "results in {n} days", resultsTomorrow: "results tomorrow", resultsToday: "results today",
  raceTitle: "{month} race",
  simulateDay: "Simulate a day", monthDone: "Month complete", resetMonth: "Back to day {day}",
  latestAlert: "Latest alert", earlierAlerts: "Earlier", noAlerts: "No rank changes yet this month.",
  noAlertsToday: "Day {day}: no rank changes today.", newAlert: "New",
  alertPassed: "{x} just passed {y} as #{rank} for {artist}.",
  alertCrown: "{x} just took #1 for {artist} from {y}.",
  alertDay: "Day {day}",
  closestRace: "Closest race", closestRaceText: "{leader} leads {chaser} by {gap} for {artist}.", closestRaceTextYou: "You lead {chaser} by {gap} for {artist}.",
  closestRaceTied: "{leader} and {chaser} are tied for {artist}.", noRace: "No close races yet.",
  groupSound: "Group Sound", groupSoundSub: "Top genres, with every member weighted equally", leansHardest: "{name} leans hardest ({pct})", leansHardestYou: "You lean hardest ({pct})",
  compareGroups: "Compare with another group",
  greetMorning: "Good morning, {name}", greetAfternoon: "Good afternoon, {name}", greetEvening: "Good evening, {name}",
  topThisMonth: "Top artists this month", miniSub: "{group} · {results}",
  resetDemo: "Reset demo",
  // Group switcher and join
  yourGroups: "Your groups", joinGroup: "Join a group", joinTitle: "Join a group",
  joinHelp: "Enter the code a friend shared. Free plan: join as many groups as you like.",
  joinPlaceholder: "Group code, e.g. ROOMIES", joinButton: "Join",
  joinOk: "You joined {group}.", joinAlready: "You're already in {group}.", joinBad: "No group uses the code \"{code}\". Check the spelling and try again.",
  joinEmpty: "Type a group code first.",
  // Rank
  rankTitle: "Leaderboards", searchArtists: "Search artists", noArtists: "No artist matches \"{q}\".",
  fromFirst: "{n} from #1", tiedFirst: "tied for #1",
  youAreFirst: "You're #1 for {artist}.", youAreBehind: "You're #{rank}, {n} from #1 for {artist}.", youNoPlays: "You haven't played {artist} yet.",
  // Match
  matchTitle: "Compatibility", matchSub: "Cosine similarity of real all-time top-50 artist plays",
  matchTiers: [[70, "Musical soulmates"], [45, "Great overlap"], [25, "Some common ground"], [0, "Opposites attract"]],
  sharedArtists: "Shared artists", noShared: "No artists in common. Time for a recommendation.",
  twins: "Musical twins", opposites: "Musical opposites", pickTwo: "Pick two different people.",
  // Challenges
  challengesTitle: "Challenges", activeChallenges: "Active challenges ({n} of {max})", noChallenges: "No active challenges. Start one.",
  newChallenge: "New challenge", createChallenge: "Start challenge", cancel: "Cancel", endChallenge: "End",
  challengeLimit: "The free plan allows two challenges at a time. End one to start another.",
  challengeCreated: "Challenge started.", challengeEnded: "Challenge ended.",
  typeDuel: "Biggest fan duel", typeRecommend: "Recommend and convert", typeGoal: "Group goal",
  duelTitle: "{a} vs {b} · {artist}", duelLead: "{name} leads by {n}", duelLeadYou: "You lead by {n}", duelTied: "All tied",
  recommendTitle: "{a} recommends {artist} to {b}", recommendTitleYou: "You recommend {artist} to {b}", recommendProgress: "{b}: {n} of {target} plays", recommendDone: "{b} converted!",
  goalTitle: "{target} plays of {artist}", goalProgress: "{n} of {target} plays", goalDone: "Goal reached!",
  daysLeft: "{n} days left", oneDayLeft: "1 day left", lastDay: "Last day",
  stakes: "Stakes: {stakes}",
  fieldType: "Type", fieldYou: "You", fieldOpponent: "Opponent", fieldFriend: "Friend", fieldArtist: "Artist", fieldTarget: "Target plays", fieldStakes: "Stakes",
  defaultStakes: "Bragging rights",
  // Recap
  recapTitle: "{month} recap", recapSoFar: "{month} so far",
  topArtist: "Top artist", topGenre: "Top genre", totalPlays: "Group plays", biggestFan: "Biggest fan",
  biggestFanText: "{name}, {n} of {artist}",
  awardsTitle: "Group awards", rankChanges: "Biggest rank changes", noRankChanges: "No rank changes vs. {month}.",
  climbed: "{name} climbed from #{from} to #{to} for {artist}", slipped: "{name} slipped from #{from} to #{to} for {artist}",
  makeShareCard: "Make my share card",

function membersOf(gk) { return [...new Set([...(DATA.groups[gk] || []), ...(CONFIG.groups[gk].extraMembers || [])])].filter((pk) => DATA.people[pk]); }

/** Each person's typical monthly volume (seeded), then month-to-month wobble. */
function monthlyTotal(pk, mi) {
  const s = CONFIG.sim;
  const base = Math.exp(Math.log(s.medianMonthlyPlays) + s.spread * gauss(mulberry32(hash(`${s.seed}|${pk}|base`))));
  const wobble = Math.exp(s.monthToMonth * gauss(mulberry32(hash(`${s.seed}|${pk}|${mi}|wobble`))));
  return Math.max(s.minPlays, Math.min(s.maxPlays, Math.round(base * wobble)));
}

const SIM_CACHE = new Map();

/** Rank-change alerts for the current month, from day 2 up to `upTo`. */
function alertsFor(gk, upTo) {
  const artists = groupArtists(gk, { kind: "all" }).slice(0, CONFIG.sim.alertArtists).map(([a]) => a);
  const out = [];
  for (let d = 2; d <= upTo; d++) {
    const today = [];
    for (const artist of artists) {
      const before = leaderboard(gk, artist, { kind: "month", mi: THIS, day: d - 1 });
      const now = leaderboard(gk, artist, { kind: "month", mi: THIS, day: d });
      now.forEach((row, idx) => {
        const r = idx + 1, was = rankOf(before, row.pk);
        if (r > 3 || was <= r || row.plays < CONFIG.sim.alertMinPlays) return;
        // The person directly passed: was above them yesterday, is below them today with strictly fewer plays.
        const passed = now.slice(idx + 1).find((o) => rankOf(before, o.pk) < was && o.plays < row.plays);
        if (passed) today.push({ day: d, artist, x: row.pk, y: passed.pk, rank: r });
      });
    }
    today.sort((a, b) => a.rank - b.rank || (b.x === CONFIG.viewer || b.y === CONFIG.viewer) - (a.x === CONFIG.viewer || a.y === CONFIG.viewer));

function closestRace(gk) {
  let best = null;
  for (const [artist] of groupArtists(gk, { kind: "all" }).slice(0, CONFIG.sim.alertArtists)) {
    const [a, b] = leaderboard(gk, artist, { kind: "month", mi: THIS });
    if (!a || !b || a.plays < 10 || b.plays === 0) continue;
    const gap = a.plays - b.plays;
    if (!best || gap < best.gap) best = { artist, leader: a.pk, chaser: b.pk, gap };
  }
  return best;
}

function challengeView(ch, gk) {

    const na = playsOf(ch.a, ch.artist, scope), nb = playsOf(ch.b, ch.artist, scope), max = Math.max(na, nb, 1);
    const leader = na > nb ? ch.a : ch.b;
    const lead = na === nb ? t("duelTied") : tYou("duelLead", leader, { name: who(leader), n: playsText(Math.abs(na - nb)) });
    return { type, title: t("duelTitle", { a: who(ch.a), b: who(ch.b, false), artist: ch.artist }), status: lead,
      bars: [[ch.a, na, max], [ch.b, nb, max]] };
  }
  if (ch.type === "recommend") {
    const n = playsOf(ch.b, ch.artist, scope);
    return { type, title: tYou("recommendTitle", ch.a, { a: who(ch.a), b: who(ch.b, false), artist: ch.artist }),

/** Recap numbers for one month of one group. */
function recapData(gk, mi) {
  const scope = { kind: "month", mi }, members = membersOf(gk);
  const artists = groupArtists(gk, scope), [topArtist, topPlays] = artists[0] || ["", 0];
  const genres = new Map();
  for (const pk of members) for (const [a, n] of artistPlays(pk, scope)) { const g = genreOf(a); if (g) genres.set(g, (genres.get(g) || 0) + n); }
  const topGenre = [...genres].sort((a, b) => b[1] - a[1])[0]?.[0] || t("genreOther");
  const fan = leaderboard(gk, topArtist, scope)[0];
  const total = members.reduce((s, pk) => s + totalOf(pk, scope), 0);
  // Awards
  const stats = members.map((pk) => {
    const ap = artistPlays(pk, scope), tot = totalOf(pk, scope) || 1, gs = genreShares(pk, scope);
    const [favArtist, favPlays] = [...ap].sort((a, b) => b[1] - a[1])[0] || ["", 0];
    const others = members.filter((o) => o !== pk);
    const unique = [...ap].filter(([a]) => !others.some((o) => ALL_TIME[o].has(a))).reduce((s, [, n]) => s + n, 0);
    const otherPlays = tot - [...ap.values()].reduce((s, n) => s + n, 0);   // plays outside their top 50
    return { pk, favArtist, loyal: favPlays / tot, genres: [...gs.values()].filter((v) => v >= 0.02).length, deep: (unique + otherPlays) / tot, purist: gs.get(topGenre) || 0 };
  });
  const best = (k) => [...stats].sort((a, b) => b[k] - a[k] || byName(a.pk, b.pk))[0];
  const awards = CONFIG.awards.map((aw) => {
    const key = { loyal: "loyal", hopper: "genres", deepcuts: "deep", purist: "purist" }[aw.id], w = best(key);
    // Awards use first names ("Grace's"), never "You's".
    const vars = { name: nameOf(w.pk), artist: w.favArtist, count: w.genres, genre: topGenre, Genre: cap(topGenre),
      pct: pct({ loyal: w.loyal, hopper: 0, deepcuts: w.deep, purist: w.purist }[aw.id]) };
    const fill = (s) => s.replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? "");
    return { pk: w.pk, title: fill(aw.title), text: fill(aw.text) };
  });
  // Biggest rank changes vs. the month before, same day of the month for the current month.
  const prev = mi - 1, changes = [];
  if (prev >= 0) {
    const day = mi === THIS ? Math.min(state.day, MONTHS[prev].days) : MONTHS[prev].days;
    for (const [artist] of artists.slice(0, 10)) {
      const now = leaderboard(gk, artist, scope), before = leaderboard(gk, artist, { kind: "month", mi: prev, day });
      for (const r of now) {
        const from = rankOf(before, r.pk), to = rankOf(now, r.pk);
        if (from !== to && r.plays > 0) changes.push({ pk: r.pk, artist, from, to, d: Math.abs(from - to) });
      }
    }
    changes.sort((a, b) => b.d - a.d || a.to - b.to);
  }
  return { topArtist, topPlays, topGenre, fan, total, awards, changes: changes.slice(0, 4), prev };
}

    <div class="card">
      <h2>${tx("awardsTitle")}</h2>
      ${r.awards.map((a) => `<div class="award">${avatar(a.pk, "lg")}<div><h3>${esc(a.title)}</h3><p class="small muted">${esc(a.text)}</p></div></div>`).join("")}
    </div>
    <div class="card">
      <h2>${tx("rankChanges")}</h2>
      ${r.changes.length ? `<div class="list">${r.changes.map((c) => `<div class="li">${avatar(c.pk, "sm")}<p class="grow small">${esc(t(c.to < c.from ? "climbed" : "slipped", { name: who(c.pk), from: c.from, to: c.to, artist: c.artist }))}</p><span class="pill">${c.to < c.from ? "▲" : "▼"} ${c.d}</span></div>`).join("")}</div>`
        : `<p class="muted">${r.prev >= 0 ? tx("noRankChanges", { month: MONTHS[r.prev].label }) : ""}</p>`}
    </div>
    ${membersOf(gk).includes(CONFIG.viewer) ? `<button class="btn" data-action="open-share">${tx("makeShareCard")}</button>` : ""}
  </section>`;
}

/** The viewer's ranks this month, best first, for the share card. */
function viewerRanks(gk) {
  const scope = { kind: "month", mi: THIS };
  return groupArtists(gk, scope).map(([a]) => {
    const board = leaderboard(gk, a, scope), rank = rankOf(board, CONFIG.viewer);
    return { artist: a, rank, plays: board[rank - 1]?.plays || 0 };
  }).filter((r) => r.rank && r.plays > 0).sort((a, b) => a.rank - b.rank || b.plays - a.plays);
}
function renderShare() {
  const gk = state.group, ranks = viewerRanks(gk);
  if (!ranks.some((r) => r.artist === state.shareArtist)) state.shareArtist = ranks[0]?.artist || null;
  return `
  <section class="stack">
    <h1>${tx("shareTitle")}</h1>
    ${simTag()}
    ${ranks.length ? `
      <label class="field" for="share-artist">${tx("shareArtist")}
        <select class="input" id="share-artist">${ranks.slice(0, 30).map((r) => `<option value="${esc(r.artist)}" ${r.artist === state.shareArtist ? "selected" : ""}>#${r.rank} · ${esc(r.artist)}</option>`).join("")}</select></label>
      <canvas id="share-canvas" width="1080" height="1920" hidden></canvas>
      <img id="share-img" class="share-preview" alt="${esc(shareSentence(gk))}">
      <button class="btn" data-action="save-image">${tx("saveImage")}</button>
      <p class="small muted" style="text-align:center">${tx("saveHint")}</p>` : `<p class="empty">${tx("shareNoPlays")}</p>`}
  </section>`;
}
function shareInfo(gk) { return viewerRanks(gk).find((r) => r.artist === state.shareArtist); }
function shareSentence(gk) { const s = shareInfo(gk); return s ? `${t("shareLead")} #${s.rank} ${s.artist} ${t("shareTail", { group: CONFIG.groups[gk].name })}` : ""; }

/** Draw the 9:16 share card (1080x1920) onto the canvas. */
function drawShareCard(canvas, gk) {
  const ctx = canvas.getContext("2d"), s = shareInfo(gk);
  if (!ctx || !s) return;
  const W = canvas.width, H = canvas.height, F = (w, px) => `${w} ${px}px ${getComputedStyle(document.body).fontFamily}`;
  ctx.fillStyle = "#14131C"; ctx.fillRect(0, 0, W, H);
  const glow = ctx.createRadialGradient(W * 0.85, H * 0.12, 20, W * 0.85, H * 0.12, W * 0.9);
  glow.addColorStop(0, "rgba(255,138,76,0.55)"); glow.addColorStop(1, "rgba(255,138,76,0)");
  ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
  ctx.textBaseline = "alphabetic"; ctx.textAlign = "left";
  ctx.fillStyle = "#FF8A4C"; ctx.font = F(900, 64); ctx.fillText(CONFIG.appName, 90, 170);
  ctx.fillStyle = "#A7A3B5"; ctx.font = F(700, 40); ctx.fillText(MONTHS[THIS].label, 90, 230);
  ctx.fillStyle = "#F4F1EC"; ctx.font = F(800, 96); ctx.fillText(t("shareLead"), 90, 640);
  ctx.fillStyle = "#FF8A4C"; ctx.font = F(900, 300); ctx.fillText(`#${s.rank}`, 76, 930);
  // Artist name: wrap, shrinking until it fits in three lines.
  let size = 128, lines;
  do { ctx.font = F(900, size); lines = wrapLines(ctx, s.artist, W - 180); size -= 8; } while (lines.length > 3 && size > 56);
  ctx.fillStyle = "#F4F1EC"; let y = 1080;
  for (const line of lines) { ctx.fillText(line, 90, y); y += size * 1.12; }
  ctx.font = F(800, 72); for (const line of wrapLines(ctx, t("shareTail", { group: CONFIG.groups[gk].name }), W - 180)) { y += 10; ctx.fillText(line, 90, y + 40); y += 84; }
  ctx.fillStyle = "#A7A3B5"; ctx.font = F(700, 48); ctx.fillText(t("sharePlays", { n: fmt(s.plays), month: MONTHS[THIS].short }), 90, y + 110);
  // Group avatars
  const members = membersOf(gk); let x = 90;
  for (const pk of members) {
    ctx.beginPath(); ctx.arc(x + 46, 1640, 46, 0, Math.PI * 2); ctx.fillStyle = colorOf(pk); ctx.fill();
    ctx.lineWidth = 8; ctx.strokeStyle = pk === CONFIG.viewer ? "#F4F1EC" : "#14131C"; ctx.stroke();
    ctx.fillStyle = "#14131C"; ctx.font = F(900, 44); ctx.textAlign = "center"; ctx.fillText(nameOf(pk).charAt(0), x + 46, 1656); ctx.textAlign = "left";
    x += 112; if (x > W - 140) break;
  }
  ctx.fillStyle = "#A7A3B5"; ctx.font = F(700, 34); ctx.fillText(t("simLabel"), 90, 1820);
}
function wrapLines(ctx, text, max) {
  const words = text.split(/\s+/), lines = []; let cur = "";
  for (const w of words) { const next = cur ? cur + " " + w : w; if (ctx.measureText(next).width > max && cur) { lines.push(cur); cur = w; } else cur = next; }
  if (cur) lines.push(cur);
  return lines;
}
/** True when the page runs inside another page's frame (e.g. the claude.ai viewer), where plain downloads are blocked. */
function inFrame() { try { return window.self !== window.top; } catch { return true; } }

/** Save the card as PNG: the claude.ai viewer's save dialog when offered, a normal download when standalone. */
async function saveImage() {
  const canvas = $("#share-canvas");
  if (!canvas) return;
  const blob = await new Promise((res) => canvas.toBlob(res, "image/png"));
  if (!blob) { toast(t("saveFailed")); return; }
  const filename = `${CONFIG.appName.toLowerCase()}-${(state.shareArtist || "card").toLowerCase().replace(/[^a-z0-9]+/g, "-")}.png`;
  const viewer = window.claude && typeof window.claude.use === "function";
  const host = viewer ? await window.claude.use("downloads").catch(() => null) : null;
  if (host) {
    try { await host.save({ filename, data: blob }); toast(t("saved")); }
    catch (e) { toast(e && e.code === "declined" ? t("saveDeclined") : t("saveUnavailable")); }
    return;
  }
  // Inside a viewer without the save dialog (e.g. a signed-out visitor), a download link does nothing: say so.
  if (viewer || inFrame()) { toast(t("saveUnavailable")); return; }
  const url = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast(t("downloadStarted"));   // the page can't confirm the browser actually saved it
}

function renderCompare() {
  const groups = state.joined;
  if (groups.length < 2) return `<section class="stack"><h1>${tx("compareTitle")}</h1><p class="empty">${tx("needTwoGroups")}</p><button class="btn" data-action="open-join">${tx("joinGroup")}</button></section>`;
  if (!groups.includes(state.compareA)) state.compareA = state.group;
  if (!groups.includes(state.compareB) || state.compareB === state.compareA) state.compareB = groups.find((g) => g !== state.compareA);
  const side = (gk) => {
    const sig = groupArtists(gk, { kind: "all" })[0], fan = leaderboard(gk, sig[0], { kind: "all" })[0];
    return { gk, genre: groupSound(gk)[0]?.genre || t("genreOther"), sig: sig[0], fan };
  };
  const A = side(state.compareA), B = side(state.compareB);
  const tot = (gk) => new Map(groupArtists(gk, { kind: "all" }).filter(([, n]) => n > 0));
  const ta = tot(A.gk), tb = tot(B.gk);
  const shared = [...ta].filter(([a]) => tb.has(a)).map(([a, n]) => [a, n + tb.get(a)]).sort((x, y) => y[1] - x[1]).slice(0, 8);
  const sel = (id, val) => `<select class="input" id="${id}">${groups.map((g) => `<option value="${g}" ${g === val ? "selected" : ""}>${esc(CONFIG.groups[g].name)}</option>`).join("")}</select>`;
  const col = (s) => `<div class="card">
      <span class="eyebrow">${tx("topGenre")}</span><h3>${esc(cap(s.genre))}</h3>
      <span class="eyebrow">${tx("signatureArtist")}</span><div class="row">${cover(s.sig, 36)}<h3 class="grow">${esc(s.sig)}</h3></div>
      <span class="eyebrow">${tx("biggestFan")}</span><div class="row">${avatar(s.fan.pk, "sm")}<span class="small"><b>${esc(who(s.fan.pk))}</b> · ${fmt(s.fan.plays)}</span></div>
    </div>`;
  return `
  <section class="stack">
    <h1>${tx("compareTitle")}</h1>
    ${realTag()}
    <div class="two">${sel("compare-a", A.gk)}${sel("compare-b", B.gk)}</div>
    <div class="two">${col(A)}${col(B)}</div>
    <div class="card"><h2>${tx("sharedBetween")}</h2>
      ${shared.length ? `<div class="chips">${shared.map(([a]) => `<span class="chip">${esc(a)}</span>`).join("")}</div>` : `<p class="muted">${tx("noSharedGroups")}</p>`}</div>
  </section>`;
}

function renderJoin() {
  return `
  <section class="stack">
    <h1>${tx("joinTitle")}</h1>
    <p class="muted">${tx("joinHelp")}</p>
    <div class="card">
      <label class="field" for="join-code">${tx("joinPlaceholder")}
        <input class="input" id="join-code" autocomplete="off" autocapitalize="characters" value="${esc(state.joinCode)}" placeholder="ROOMIES"></label>
      <button class="btn" data-action="join">${tx("joinButton")}</button>
      ${state.joinMessage ? `<p class="note" role="status">${esc(state.joinMessage)}</p>` : ""}
    </div>
    <div class="card"><h2>${tx("yourGroups")}</h2>
      <div class="list">${state.joined.map((g) => `<div class="li"><div class="avs">${membersOf(g).slice(0, 4).map((pk) => avatar(pk, "sm")).join("")}</div><span class="grow name">${esc(CONFIG.groups[g].name)}</span><span class="small muted">${tx("homeMembers", { n: membersOf(g).length })}</span></div>`).join("")}</div>
    </div>
  </section>`;
}

/* =====================================================================================
   APP SHELL: top bar, nav, sheet, toast, rendering and events
   ===================================================================================== */
const TABS = [["home", "navHome"], ["rank", "navRank"], ["match", "navMatch"], ["challenges", "navChallenges"], ["recap", "navRecap"]];
const SCREENS = { home: renderHome, rank: renderRank, match: renderMatch, challenges: renderChallenges, recap: renderRecap, share: renderShare, compare: renderCompare, join: renderJoin };

function render() {
  const screen = state.overlay || state.tab;
  $("#top").innerHTML = state.overlay
    ? `<button class="back" data-action="close-overlay">${icon("back")}${tx("back")}</button><span class="brand">${brandHtml()}</span>`
    : `<span class="brand">${brandHtml()}</span><button class="switcher" data-action="open-switcher" aria-haspopup="dialog"><span>${esc(CONFIG.groups[state.group].name)}</span>${icon("chevron")}</button>`;
  $("#screen").innerHTML = SCREENS[screen]();
  document.querySelector(".app").style.setProperty("--hero-a", (CONFIG.groups[state.group].color || "#FF8A4C") + "59");
  document.documentElement.style.setProperty("--hero-a", (CONFIG.groups[state.group].color || "#FF8A4C") + "59");
  $("#mini").hidden = !!state.overlay;
  $("#mini").innerHTML = state.overlay ? "" : miniHtml();
  $("#nav").innerHTML = TABS.map(([k, label]) => `<button data-action="tab" data-value="${k}" ${!state.overlay && state.tab === k ? 'aria-current="page"' : ""}>${icon(k, "")}${tx(label)}</button>`).join("");
  if (screen === "share" && $("#share-canvas")) {
    // Drawn on a hidden canvas, shown as an <img> so long-press / right-click "Save image" works everywhere.
    drawShareCard($("#share-canvas"), state.group);
    try { $("#share-img").src = $("#share-canvas").toDataURL("image/png"); } catch { /* preview only; Save image still works */ }
  }
  save();
}
function brandHtml() { const n = CONFIG.appName, i = Math.ceil(n.length / 2); return /^Jam/.test(n) ? `Jam<b>${esc(n.slice(3))}</b>` : `${esc(n.slice(0, i))}<b>${esc(n.slice(i))}</b>`; }

function openSwitcher() {
  const el = $("#sheet");
  el.innerHTML = `<div class="sheet-backdrop" data-action="close-sheet"><div class="sheet" role="dialog" aria-modal="true" aria-label="${tx("yourGroups")}">
    <span class="eyebrow">${tx("yourGroups")}</span>
    <div class="list">${state.joined.map((g) => `<div class="li"><button data-action="switch-group" data-value="${g}"><div class="avs">${membersOf(g).slice(0, 3).map((pk) => avatar(pk, "sm")).join("")}</div><span class="grow">${esc(CONFIG.groups[g].name)}</span>${g === state.group ? '<span class="pill new">✓</span>' : ""}</button></div>`).join("")}</div>
    <button class="btn" data-action="open-join">${tx("joinGroup")}</button>
  </div></div>`;
  el.hidden = false;
  el.querySelector("button")?.focus();
}
function closeSheet() { $("#sheet").hidden = true; $("#sheet").innerHTML = ""; }

let toastTimer;
function toast(msg) { const el = $("#toast"); el.textContent = msg; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, msg.length > 60 ? 5000 : 2600); }
function go(tab) { state.tab = tab; state.overlay = null; render(); window.scrollTo(0, 0); }
function overlay(name) { closeSheet(); state.overlay = name; render(); window.scrollTo(0, 0); }

const ACTIONS = {
  "tab": (v) => go(v),
  "close-overlay": () => { state.overlay = null; render(); },
  "open-switcher": openSwitcher,
  "close-sheet": (v, e) => { if (e.target.matches(".sheet-backdrop")) closeSheet(); },   // only taps outside the sheet
  "switch-group": (v) => { state.group = v; closeSheet(); state.newAlertDay = null; state.rankArtist = null; render(); },
  "open-join": () => { state.joinMessage = null; state.joinCode = ""; overlay("join"); },
  "open-compare": () => overlay("compare"),
  "pick-group": (v) => { state.group = v; state.newAlertDay = null; state.rankArtist = null; render(); window.scrollTo(0, 0); },
  "open-artist": (v) => { state.rankArtist = v; state.rankSearch = ""; state.rankScope = "this"; go("rank"); },
  "open-share": () => overlay("share"),
  "join": () => {
    const code = ($("#join-code")?.value || "").trim().toUpperCase();
    state.joinCode = code;
    const gk = Object.keys(CONFIG.groups).find((k) => CONFIG.groups[k].code.toUpperCase() === code);
    if (!code) state.joinMessage = t("joinEmpty");
    else if (!gk) state.joinMessage = t("joinBad", { code });
    else if (state.joined.includes(gk)) state.joinMessage = t("joinAlready", { group: CONFIG.groups[gk].name });
    else { state.joined.push(gk); state.group = gk; state.tab = "home"; state.rankArtist = null; state.newAlertDay = null; state.joinMessage = t("joinOk", { group: CONFIG.groups[gk].name }); toast(state.joinMessage); }
    render();
  },
  "simulate-day": () => {
    if (state.day >= MONTHS[THIS].days) return;
    state.day += 1;
    const fresh = alertsFor(state.group, state.day).filter((a) => a.day === state.day);
    state.newAlertDay = fresh.length ? state.day : -1;
    render();
    if (fresh.length) toast(alertText(fresh[fresh.length - 1]));
  },
  "reset-day": () => { state.day = CONFIG.sim.startDay; state.newAlertDay = null; render(); },
  "reset-demo": () => { clearSaved(); Object.assign(state, { day: CONFIG.sim.startDay, joined: [...CONFIG.startJoined], group: CONFIG.startJoined[0], challenges: structuredClone(CONFIG.challenges), newAlertDay: null, challengeForm: null }); go("home"); },
  "rank-scope": (v) => { state.rankScope = v; render(); },
  "recap-scope": (v) => { state.recapScope = v; render(); },
  "pick-artist": (v) => { state.rankArtist = v; render(); $("#board")?.scrollIntoView({ block: "nearest" }); },
  "new-challenge": () => { state.challengeForm = { type: "duel" }; render(); },
  "close-form": () => { state.challengeForm = null; render(); },
  "create-challenge": () => {
    const gk = state.group, members = membersOf(gk), me = members.includes(CONFIG.viewer) ? CONFIG.viewer : members[0];
    const type = $("#ch-type").value, artist = $("#ch-artist").value;
    const target = Math.max(1, Math.min(100000, parseInt($("#ch-target")?.value, 10) || 1));
    const stakes = ($("#ch-stakes").value || "").trim().slice(0, 80) || t("defaultStakes");
    const ch = type === "goal" ? { type, artist, target, stakes } : { type, a: me, b: $("#ch-b").value, artist, stakes, ...(type === "recommend" ? { target } : {}) };
    const list = (state.challenges[gk] = (state.challenges[gk] || []).filter((c) => validChallenge(c, gk)));
    if (list.length >= CONFIG.freeChallengeLimit || !validChallenge(ch, gk)) { render(); return; }
    list.push(ch); state.challengeForm = null; render(); toast(t("challengeCreated"));
  },
  "end-challenge": (v) => { const gk = state.group; state.challenges[gk] = (state.challenges[gk] || []).filter((c) => validChallenge(c, gk)); state.challenges[gk].splice(Number(v), 1); render(); toast(t("challengeEnded")); },
  "save-image": () => saveImage(),
};

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.action];
  if (fn) fn(el.dataset.value, e);
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !$("#sheet").hidden) closeSheet();
  if (e.key === "Enter" && e.target.id === "join-code") ACTIONS.join();
});
document.addEventListener("input", (e) => {
  if (e.target.id === "artist-search") { state.rankSearch = e.target.value; $("#artist-list").innerHTML = artistListHtml(groupArtists(state.group, scopeOf(state.rankScope))); }
});
document.addEventListener("change", (e) => {
  const id = e.target.id, v = e.target.value;
  if (id === "match-a") { state.matchA = v; render(); }
  else if (id === "match-b") { state.matchB = v; render(); }
  else if (id === "compare-a") { state.compareA = v; render(); }
  else if (id === "compare-b") { state.compareB = v; render(); }
  else if (id === "share-artist") { state.shareArtist = v; render(); }
  else if (id === "ch-type") { state.challengeForm = { type: v }; render(); }
});

render();
</script>
</body>
